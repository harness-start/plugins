cases:
  - id: positive_concrete_failure
    prompt: "支付回调现在稳定返回 500，这里是复现命令和 stack trace，请定位根因并修复。"
    trigger_expected: true
    rubric:
      - "创建 Debug Work Order 后再改生产代码"
      - "先观察原始复现失败，再记录可证伪假设"

  - id: positive_multiple_bugs
    prompt: "这次升级后有三个明确失败的测试，请逐个排查，可能是同一个根因。"
    trigger_expected: true
    rubric:
      - "把多个 bug 放入同一工单并保持单一 activeBugId"
      - "共享修复仍逐 bug 复验"

  - id: positive_resume
    prompt: "继续处理 .debug-workflow/20260808-login.md 里的 BUG-002。"
    trigger_expected: true
    rubric:
      - "递增 run.epoch 并显式选择工单"

  - id: negative_plugin_design
    prompt: "设计一个增强调试能力的插件，并比较四个 debugging skills。"
    trigger_expected: false
    rubric:
      - "这是插件设计，不进入具体故障排查"

  - id: negative_review
    prompt: "审查这个模块，看看有没有潜在 bug，但不要修改。"
    trigger_expected: false
    rubric:
      - "普通代码审查不应创建调试工单"

  - id: negative_incident_containment
    prompt: "线上正在大面积 503，先帮我止血和隔离流量。"
    trigger_expected: false
    rubric:
      - "先路由到事故响应，而不是普通调试工作流"
