cases:
  - id: positive_known_bug_fix
    prompt: "这个解析器的根因已经定位：空字符串走错默认分支。请修复并防止边界回归。"
    trigger_expected: true
    rubric:
      - "在改生产代码前定义 primary、不同维度 challenge 和 invariant"
      - "创建显式 behavioral regression contract"

  - id: positive_failing_regression
    prompt: "升级后这个稳定失败的测试是一个回归；修好它，同时确保旧格式仍然兼容。"
    trigger_expected: true
    rubric:
      - "把失败复现与兼容性行为都纳入前后证据"
      - "不以单个测试转绿代替回归证明"

  - id: positive_behavior_change
    prompt: "修改重试状态机的终止条件，但不能破坏幂等重放和错误码合同。"
    trigger_expected: true
    rubric:
      - "用 state-transition、ordering 或 error-contract challenge 约束变更"
      - "保留兼容性 invariant"

  - id: positive_resume
    prompt: "继续 `.behavioral-regression/BR-20260809-normalize.json`，上次已经暂停。"
    trigger_expected: true
    rubric:
      - "递增 epoch 后通过 contract mutation 恢复"
      - "只保留仍有效的 BEFORE receipts"

  - id: negative_unknown_symptom
    prompt: "接口偶尔超时但没有稳定复现，请先帮我找原因。"
    trigger_expected: false
    rubric:
      - "先走调试/探针流程，不提前建立行为回归闭环"

  - id: negative_feature_work
    prompt: "给设置页新增一个主题选择器，规格已经确定。"
    trigger_expected: false
    rubric:
      - "普通新功能不应创建 behavioral regression contract"

  - id: negative_plugin_design
    prompt: "设计一个用 hooks 约束回归测试流程的插件。"
    trigger_expected: false
    rubric:
      - "插件设计本身不激活被设计的工作流"

  - id: negative_active_incident
    prompt: "线上大面积 503，先止血、隔离流量并恢复服务。"
    trigger_expected: false
    rubric:
      - "活动事故优先走 incident response"
