cases:
  - id: positive_worst_case_guarantee
    prompt: "最少取多少个才能保证满足条件？请证明最小性，并注意题目允许提前选择策略。"
    trigger_expected: true
    rubric:
      - "选择 exact 分支并显式记录策略变量"
      - "给出反例和独立验证"

  - id: positive_algorithm_correctness
    prompt: "证明这个并发算法不会丢更新，并构造一个最强的反例尝试推翻证明。"
    trigger_expected: true
    rubric:
      - "使用 exact 分支"
      - "区分假设、推导、挑战和交叉验证"

  - id: positive_causal_diagnosis
    prompt: "同一请求只在 key 归一化之后发生缓存串值，请比较至少两个原因并定位真正因果链。"
    trigger_expected: true
    rubric:
      - "使用 causal 分支"
      - "记录可证伪替代假设和区分性测试"

  - id: positive_decision
    prompt: "在恢复时间、成本和数据一致性三个硬约束下比较两种架构，并检查权重变化会不会翻转结论。"
    trigger_expected: true
    rubric:
      - "使用 decision 分支"
      - "执行敏感性分析"

  - id: positive_resume
    prompt: "继续 `.reasoning-discipline/20260809-cache/workflow.md` 中暂停的 cross-check。"
    trigger_expected: true
    rubric:
      - "递增 epoch 并明确选择工作流"

  - id: negative_simple_lookup
    prompt: "法国首都是哪里？一句话回答。"
    trigger_expected: false
    rubric:
      - "简单事实不应创建推理工作流"

  - id: negative_routine_implementation
    prompt: "按现有接口给 UserCard 增加一个 disabled prop，规格已经确定。"
    trigger_expected: false
    rubric:
      - "普通实现任务不应抢占工程 Skill"

  - id: negative_plugin_design
    prompt: "设计一个通过 hooks 约束模型推理阶段的插件。"
    trigger_expected: false
    rubric:
      - "设计推理工具本身不激活被设计的工作流"

  - id: negative_incident
    prompt: "线上大面积 503，先止血、隔离流量并恢复服务。"
    trigger_expected: false
    rubric:
      - "活动事故先走 incident response"
